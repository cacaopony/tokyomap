<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1424" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="東京凸凹散歩" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <title>東京凸凹散歩</title>
</head>
<body>
  <div id="map"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>東京凸凹散歩</h1>
        <p>23区の 高低差 × 歴史</p>
      </div>
    </div>
    <button class="btn-search" id="btn-list" aria-label="スポットを探す">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>スポット</span>
    </button>
  </header>

  <nav class="fabs" aria-label="地図操作">
    <button class="fab" id="btn-layers" title="地図の表現"><svg viewBox="0 0 24 24"><path d="M12 3 2 8.5 12 14l10-5.5L12 3Z M2 13l10 5.5L22 13 M2 17.5 12 23l10-5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>表現</span></button>
    <button class="fab" id="btn-3d" title="3D表示"><b>3D</b><span>立体</span></button>
    <button class="fab" id="btn-profile" title="断面図"><svg viewBox="0 0 24 24"><path d="M2 19 7 11l4 4 4-9 7 13Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>断面</span></button>
    <button class="fab" id="btn-sea" title="海面シミュレーション"><svg viewBox="0 0 24 24"><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 20c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M12 3v7M9 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>海面</span></button>
    <button class="fab" id="btn-locate" title="現在地"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke="currentColor" stroke-width="1.8"/></svg><span>現在地</span></button>
  </nav>

  <div class="legend" id="legend"></div>
  <div class="toast" id="toast" hidden></div>

  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-grip" id="sheet-grip"><span></span></div>
    <button class="sheet-close" id="sheet-close" aria-label="閉じる">×</button>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
